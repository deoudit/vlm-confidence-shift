# HuggingFaceTB/SmolVLM-Instruct on MMBench-dev perception
# answer_prefix puts the scored letter at the answer position.
model:
  name: "HuggingFaceTB/SmolVLM-Instruct"
  dtype: "float16"
  device: "cuda:0"
  attn_implementation: "eager"   # required for output_attentions
  trust_remote_code: false
  answer_prefix: " Answer:"
data:
  mmbench_tsv: "data/MMBench_DEV_EN.tsv"
  perception_only: true
  n_questions: 1000
  seed: 0
corruptions:
  types: ["fog", "snow", "defocus_blur", "brightness"]
  severities: [1, 2, 3, 4, 5]
signals:
  logit_lens_last_L: 8
  attention_layers: [-1, -2]
paths:
  features_dir: "outputs/features_smolvlm_instruct"
  results_dir: "outputs/results_smolvlm_instruct"
