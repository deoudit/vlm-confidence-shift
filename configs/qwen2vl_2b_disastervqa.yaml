# Qwen/Qwen2-VL-2B-Instruct on DisasterVQA (single-answer MC)
model:
  name: "Qwen/Qwen2-VL-2B-Instruct"
  dtype: "float32"
  device: "cuda:0"
  attn_implementation: "eager"   # required for output_attentions
  trust_remote_code: false
  max_pixels: 602112
data:
  benchmark: "disastervqa"
  mmbench_tsv: "data/MMBench_DEV_EN.tsv"
  perception_only: true
  n_questions: 2000   # all 1,434 single-answer items are used
  seed: 0
corruptions:
  types: []
  severities: []  # naturally degraded images: clean condition only
signals:
  logit_lens_last_L: 8
  attention_layers: [-1, -2]
paths:
  features_dir: "outputs/features_qwen2vl_2b_disastervqa"
  results_dir: "outputs/results_qwen2vl_2b_disastervqa"
